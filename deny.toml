# cargo-deny policy for ERPForAll.
#
# ERPForAll is distributed under MIT OR Apache-2.0, and premium addons may be proprietary.
# Rule: dependencies that ship must be permissive (or MPL-2.0, per-file copyleft);
# build-time-only tools that never ship may be LGPL (see web/licenses.json `dev_only`); GPL and AGPL
# never. This file covers Rust crates, all of which ship, so LGPL crates are rejected here.
# Run: `cargo deny check` (part of scripts/ci.sh).

[graph]
# Build hosts and the platforms we ship to. Keeps Windows/macOS-only crates out of the licence check
# noise while still covering what we distribute.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
]
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec database. Vulnerabilities are always errors; unmaintained/unsound notices apply to the
# whole graph. Add an `ignore` entry only with a reason and an issue link.
unmaintained = "all"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "allow"
ignore = [
    # rustix 1.1.5, unsound xattr functions with a zero-length buffer; published 2026-11-11. Nothing in this
    # workspace or in vendor/ calls the rustix xattr functions. Removed with the update to >= 1.1.6: board task
    # DEPS.RUSTIX-0486 (a lock change takes a full run of its own).
    { id = "RUSTSEC-2026-0486", reason = "xattr functions are not called; rustix is updated by DEPS.RUSTIX-0486" },
    # chrono and humantime, marked unmaintained on 2026-11-17 (no vulnerability reported, no safe upgrade). Both are in
    # the lock only under object_store (erp-blob). Removed when object_store drops them: board task DEPS.CHRONO-0543
    # (a lock change takes a full run of its own).
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, reached only through object_store under erp-blob; followed by DEPS.CHRONO-0543" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained (wraps chrono), reached only through object_store under erp-blob; followed by DEPS.CHRONO-0543" },
    # wasmi 2.0.0 and wasmi_core 2.0.0, yanked upstream on 2026-11-18 (no advisory). A dev-dependency of
    # erp-ui-compiler-cli only (tests); never shipped. Removed with the lock update to the next wasmi release (a lock
    # change takes a full run of its own).
    { crate = "wasmi@2.0.0", reason = "yanked 2026-11-18, dev-dependency of erp-ui-compiler-cli tests only; lock update follows" },
    { crate = "wasmi_core@2.0.0", reason = "yanked 2026-11-18 with wasmi 2.0.0, dev-dependency only; lock update follows" },
    # The report engine's Typst dependencies (Licences; reviewed again at every Typst upgrade).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml under citationberg (CSL/bibliography parsing): the report World never serves a bibliography or CSL file" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader under citationberg (CSL parsing): unreachable, no bibliography or CSL input" },
    { id = "RUSTSEC-2025-0141", reason = "bincode under syntect/two-face: deserialises compiled-in syntax dumps; code blocks are not in the print profile" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust under syntect/two-face: compiled-in syntax data only; code blocks are not in the print profile" },
    { id = "RUSTSEC-2024-0436", reason = "paste under biblatex: a proc-macro, compile time only" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml under serde_yaml/hayagriva: YAML bibliography parsing, unreachable" },
    # Risk row: reachable shaping and font parsing. Only digest-admitted shipped fonts are parsed
    # and shaped (a family outside the compiled manifest is refused, uploaded fonts included), and a served
    # node builds the engine only inside a render worker process (`erp report-worker`).
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained, reachable for shaping; risk row, until Typst and krilla move to harfrust" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, reachable for font parsing; risk row, until Typst and krilla move to skrifa" },
]

[licenses]
# Anything not listed here is denied, including GPL-*, LGPL-* and AGPL-*.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # roman-numerals-rs (0BSD OR CC0-1.0) under typst-library; allowed, added.
    "0BSD",
]
confidence-threshold = 0.9
# The list is a policy, not an inventory: do not warn about allowed licences no crate uses yet.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Workspace crates are `publish = false` and carry MIT OR Apache-2.0; they are checked like any other.
ignore = false
registries = []

[bans]
multiple-versions = "allow"
# `path` dependencies inside the workspace have no version; allow those, deny `*` from registries.
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
