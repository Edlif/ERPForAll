erp-registry.workspace = true
erp-fields.workspace = true
thiserror.workspace = true

[dev-dependencies]
erp-testkit = { workspace = true }
# `base_users`: the users model the non-superuser test runs under.
erp-test-models = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
