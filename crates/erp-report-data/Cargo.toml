[package]
name = "erp-report-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The ORM side of the report data stage: set-based reads under the caller's rights"

[lints]
workspace = true

[dependencies]
erp-report.workspace = true
erp-orm.workspace = true
