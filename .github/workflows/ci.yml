# Continuous integration for pull requests, pushes to main, and weekly full sharded verification.
#
# Pull requests and sync pushes run `scripts/affected-packages.py` first and execute Rust/DB tests only for
# affected packages (with prebuilt nextest, lld, and Swatinem/rust-cache) so runs finish quickly inside the
# 14 GB disk budget of GitHub-hosted runners. Weekly scheduled runs and manual dispatches verify the full
# workspace across package shards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_rust: ${{ steps.plan.outputs.run_rust }}
      run_web: ${{ steps.plan.outputs.run_web }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      sharded: ${{ steps.plan.outputs.sharded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute affected scope
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_web=true" >> "$GITHUB_OUTPUT"
            echo "base_ref=HEAD" >> "$GITHUB_OUTPUT"
            echo "sharded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$GITHUB_BASE_REF"
          else
            base="HEAD~1"
          fi
          json="$(python3 -I scripts/affected-packages.py --base "$base" --committed-only --format json)"
          echo "plan=$json"
          mode="$(python3 -I -c 'import json,sys; print(json.loads(sys.argv[1])["mode"])' "$json")"
          run_rust="$(python3 -I -c 'import json,sys; print("true" if json.loads(sys.argv[1])["run_rust"] else "false")' "$json")"
          run_web="$(python3 -I -c 'import json,sys; print("true" if json.loads(sys.argv[1])["run_web"] else "false")' "$json")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
          echo "run_web=$run_web" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "full" ] && [ "$run_rust" = "true" ]; then
            echo "sharded=true" >> "$GITHUB_OUTPUT"
          else
            echo "sharded=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: plan
    if: needs.plan.outputs.run_rust == 'true' && needs.plan.outputs.sharded == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ERP_TEST_DATABASE_URLS: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install prebuilt cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Format, layers, clippy and affected tests
        env:
          PLAN_BASE_REF: ${{ needs.plan.outputs.base_ref }}
        run: scripts/check.sh --affected "$PLAN_BASE_REF" --committed-only --tests

  rust-full-sharded:
    needs: plan
    if: needs.plan.outputs.sharded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [core, addons, suites, cli]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ERP_TEST_DATABASE_URLS: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install prebuilt cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: shard-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Run shard checks and tests
        run: |
          set -euo pipefail
          pkgs="$(python3 -I scripts/affected-packages.py --shard "${{ matrix.shard }}")"
          if [ -z "$pkgs" ]; then
            echo "shard ${{ matrix.shard }} has no packages; skipping"
            exit 0
          fi
          args=()
          for p in $pkgs; do
            args+=(-p "$p")
          done
          scripts/check.sh "${args[@]}" --tests

  web:
    needs: plan
    if: needs.plan.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Node and pnpm
        run: |
          scripts/web-toolchain.sh install
          scripts/web-toolchain.sh check
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-linux-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-linux-
      - name: Install dependencies, type check and test
        run: |
          eval "$(scripts/web-toolchain.sh env)"
          pnpm --dir web install --frozen-lockfile
          cd web
          pnpm run typecheck
          pnpm exec vitest run --exclude "**/differential-property.test.ts" --exclude "**/hostile-property.test.ts"
