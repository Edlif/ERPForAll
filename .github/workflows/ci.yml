# Continuous integration.
#
# Pull requests and pushes to main run a light check that fits a GitHub-hosted runner (about 14 GB of disk):
# formatting, layer checks and clippy for the packages the diff affects, the web type check and tests when web
# files changed, and, on pull requests, a DCO sign-off check. The Rust and database test suites do not run here:
# the maintainers run the full suite on their own hosts before a change reaches `main`. The weekly schedule and
# a manual dispatch run the full workspace tests across package shards.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      run_rust: ${{ steps.plan.outputs.run_rust }}
      run_web: ${{ steps.plan.outputs.run_web }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      sharded: ${{ steps.plan.outputs.sharded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute affected scope
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "run_rust=true" >> "$GITHUB_OUTPUT"
            echo "run_web=true" >> "$GITHUB_OUTPUT"
            echo "base_ref=HEAD" >> "$GITHUB_OUTPUT"
            echo "sharded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="origin/$GITHUB_BASE_REF"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="HEAD~1"
          fi
          json="$(python3 -I scripts/affected-packages.py --base "$base" --committed-only --format json)"
          echo "plan=$json"
          mode="$(python3 -I -c 'import json,sys; print(json.loads(sys.argv[1])["mode"])' "$json")"
          run_rust="$(python3 -I -c 'import json,sys; print("true" if json.loads(sys.argv[1])["run_rust"] else "false")' "$json")"
          run_web="$(python3 -I -c 'import json,sys; print("true" if json.loads(sys.argv[1])["run_web"] else "false")' "$json")"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"
          echo "run_web=$run_web" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          # Only the weekly schedule and a manual dispatch run the sharded test suite, even when the diff
          # touches a global input and the light check widens to the whole workspace.
          echo "sharded=false" >> "$GITHUB_OUTPUT"

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit of the pull request carries a Signed-off-by line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/check-dco.py "$BASE_SHA" "$HEAD_SHA"

  rust:
    needs: plan
    if: needs.plan.outputs.run_rust == 'true' && needs.plan.outputs.sharded == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Format, layers and clippy of the affected packages
        env:
          PLAN_BASE_REF: ${{ needs.plan.outputs.base_ref }}
        run: scripts/check.sh --affected "$PLAN_BASE_REF" --committed-only

  rust-full-sharded:
    needs: plan
    if: needs.plan.outputs.sharded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [core, addons, suites, cli]
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/erpforall
      ERP_TEST_DATABASE_URLS: postgres://postgres:postgres@127.0.0.1:5432/erpforall
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 18
        # The default lock table is too small for the parallel database tests ("out of shared memory"), and the
        # tests refuse the system database named postgres, so the server gets its own database.
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=erpforall \
            postgres:18 -c max_connections=200 -c max_locks_per_transaction=256
          for _ in $(seq 1 60); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d erpforall && exit 0
            sleep 2
          done
          docker logs pg
          exit 1
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Install lld linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install prebuilt cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: shard-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Run shard checks and tests
        run: |
          set -euo pipefail
          pkgs="$(python3 -I scripts/affected-packages.py --shard "${{ matrix.shard }}")"
          if [ -z "$pkgs" ]; then
            echo "shard ${{ matrix.shard }} has no packages; skipping"
            exit 0
          fi
          args=()
          for p in $pkgs; do
            args+=(-p "$p")
          done
          scripts/check.sh "${args[@]}" --tests

  web:
    needs: plan
    if: needs.plan.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Node and pnpm
        run: |
          scripts/web-toolchain.sh install
          scripts/web-toolchain.sh check
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-linux-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-linux-
      - name: Install dependencies, type check and test
        run: |
          eval "$(scripts/web-toolchain.sh env)"
          pnpm --dir web install --frozen-lockfile
          cd web
          pnpm run typecheck
          pnpm exec vitest run --exclude "**/differential-property.test.ts" --exclude "**/hostile-property.test.ts"
