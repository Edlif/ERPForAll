# Continuous integration for pull requests and pushes to main.
#
# Rust job: `scripts/check.sh --tests` runs formatting, clippy, a build and the Rust tests against a PostgreSQL 18
# service container. The test support creates and drops its own databases on the server named by DATABASE_URL.
# Web job: type check and unit tests of the web workspace with the pinned Node and pnpm.
#
# Honest limits: the project's authors run these commands on their own Linux build machine. On GitHub-hosted
# runners the Rust job has not passed yet (it ran out of disk; the settings below are the first adjustment). Tests that need tools the runner lacks are
# not skipped silently: they fail and show what is missing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      ERP_TEST_DATABASE_URLS: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # A hosted runner has about 14 GB of free disk and this job ran out of it (2026-11-17, "No space left on
      # device" after 43 minutes): build without debug info and incremental state, as the project's own CI does.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space on the runner
        # preinstalled toolchains this job never uses
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Format, lints, build and tests
        run: scripts/check.sh --tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Node and pnpm
        run: |
          scripts/web-toolchain.sh install
          scripts/web-toolchain.sh check
      - name: Install dependencies, type check and test
        run: |
          eval "$(scripts/web-toolchain.sh env)"
          pnpm --dir web install --frozen-lockfile
          cd web
          pnpm run typecheck
          pnpm exec vitest run --exclude "**/differential-property.test.ts" --exclude "**/hostile-property.test.ts"
