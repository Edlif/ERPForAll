# SPDX-License-Identifier: MIT OR Apache-2.0
name: Feature request
description: Suggest a capability or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Larger ideas are easier to shape together in the Ideas category of Discussions first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs it, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: placement
    attributes:
      label: Core or addon?
      description: The core stays small; business domains are addons.
      options:
        - Core framework
        - An existing addon
        - A new addon
        - Not sure
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
